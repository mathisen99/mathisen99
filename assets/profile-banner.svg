<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title description">
  <title id="title">Tommy Mathisen</title>
  <desc id="description">Software developer simplifying complexity with AI, Linux and automation.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020604" />
      <stop offset="0.5" stop-color="#07110B" />
      <stop offset="1" stop-color="#0C2416" />
    </linearGradient>
    <linearGradient id="glass" x1="90" y1="70" x2="1090" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07130C" stop-opacity="0.94" />
      <stop offset="1" stop-color="#041009" stop-opacity="0.72" />
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(935 210) rotate(90) scale(250 320)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A7D46F" stop-opacity="0.18" />
      <stop offset="0.55" stop-color="#3C8A4D" stop-opacity="0.06" />
      <stop offset="1" stop-color="#07110B" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#A7D46F" stroke-opacity="0.045" />
    </pattern>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="24" />
    </filter>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.52" />
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="440" rx="26" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="440" fill="url(#background)" />
    <rect width="1200" height="440" fill="url(#grid)" />
    <rect width="1200" height="440" fill="url(#glow)" />

    <g opacity="0.44" fill="#174D2C">
      <path d="M-28 372C50 294 30 145 153 16c-7 86-27 149-68 211 51-47 90-78 148-99-33 89-97 157-175 207 67-18 115-20 180-9-70 55-152 81-266 78Z" />
      <path d="M1234 2c-87 44-122 99-148 169 5-69-1-116-29-171-42 72-46 136-28 209-32-47-62-74-114-104 8 77 45 145 104 196-52-20-94-26-151-23 66 67 155 103 366 111Z" />
    </g>
    <g opacity="0.19" fill="#A7D46F" filter="url(#blur)">
      <ellipse cx="106" cy="80" rx="96" ry="52" transform="rotate(-38 106 80)" />
      <ellipse cx="1110" cy="340" rx="114" ry="48" transform="rotate(26 1110 340)" />
