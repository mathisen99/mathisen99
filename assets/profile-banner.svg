      <path d="M70 118V86c0-15 12-28 28-28h43" fill="none" stroke="#A7D46F" stroke-opacity="0.85" />
      <path d="M1130 322v32c0 15-12 28-28 28h-43" fill="none" stroke="#A7D46F" stroke-opacity="0.48" />
    </g>

    <g font-family="Inter, Segoe UI, Arial, sans-serif">
      <text x="124" y="116" fill="#9EAC9D" font-size="16" font-weight="600" letter-spacing="3">SOFTWARE DEVELOPER · JOMALA, ÅLAND</text>
      <text x="122" y="182" fill="#EDF3E8" font-size="48" font-weight="750" letter-spacing="-1.4">Tommy Mathisen<tspan fill="#A7D46F">.</tspan></text>
      <text x="124" y="241" fill="#EDF3E8" font-size="32" font-weight="450" letter-spacing="-0.5">Simplifying complexity with</text>
      <text x="124" y="289" fill="#A7D46F" font-size="36" font-weight="700" letter-spacing="-0.6">AI, Linux &amp; Automation.</text>
      <text x="124" y="338" fill="#9EAC9D" font-size="15" font-weight="500" letter-spacing="1.8">PRACTICAL TOOLS · OPEN SYSTEMS · RELIABLE WORKFLOWS</text>
    </g>

    <g transform="translate(930 218)">
      <circle r="112" fill="#07110B" fill-opacity="0.34" stroke="#A7D46F" stroke-opacity="0.15" />
      <circle r="79" fill="none" stroke="#A7D46F" stroke-opacity="0.12" stroke-dasharray="3 9" />
      <circle r="47" fill="#0C2416" fill-opacity="0.72" stroke="#A7D46F" stroke-opacity="0.38" />
