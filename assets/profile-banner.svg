    </g>

    <text x="1082" y="350" text-anchor="end" fill="#9EAC9D" fill-opacity="0.78" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="2">TM / 2026</text>
